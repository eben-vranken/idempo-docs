site_name: idempo
site_description: >-
  Framework-agnostic HTTP idempotency middleware for Go. Make unsafe requests
  safe to retry: a duplicate runs its side effect at most once and replays the
  original response.
site_author: eben-vranken
site_url: https://eben-vranken.github.io/idempo-docs/

repo_name: eben-vranken/idempo
repo_url: https://github.com/eben-vranken/idempo
edit_uri: ""

# Pretty URLs: pages resolve at paths like /errors/conflict/.
use_directory_urls: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

plugins:
  - search

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Storage backends:
      - Overview: storage/index.md
      - In-memory: storage/in-memory.md
      - Redis: storage/redis.md
      - Postgres: storage/postgres.md
      - Write your own: storage/custom.md
  - Configuration: configuration.md
  - Behavior: behavior.md
  - Error reference:
      - Overview: errors/index.md
      - key-too-long (400): errors/key-too-long.md
      - content-too-large (413): errors/content-too-large.md
      - conflict (409): errors/conflict.md
      - body-mismatch (422): errors/body-mismatch.md
      - internal-server-error (500): errors/internal-server-error.md
